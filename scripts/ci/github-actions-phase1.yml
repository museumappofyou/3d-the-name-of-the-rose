# Phase-1 CI recipe (headless import, domain/pose tests, Windows + macOS
# exports). Kept OUT of .github/workflows on purpose: copy it there when the
# team decides to run CI. It never replaces the real-GPU Windows tests
# (W1/W2 in docs/DEVELOPMENT.md).
#
# Linux runners are case-sensitive: they also catch filename-case errors
# that macOS (case-insensitive by default) would hide.
name: migration-phase1
on: [workflow_dispatch]
jobs:
  headless:
    runs-on: ubuntu-24.04
    env:
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable
    steps:
      - uses: actions/checkout@v4
        with: { path: "repo with space/gülün" }   # exercise spaces + non-ASCII paths
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Godot 4.7.2 + templates (pinned, checksum-verified)
        run: |
          curl -sSLO "$GODOT_URL/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -sSLO "$GODOT_URL/Godot_v4.7.2-stable_export_templates.tpz"
          curl -sSLO "$GODOT_URL/SHA512-SUMS.txt"
          grep -E "linux.x86_64.zip|_export_templates.tpz" SHA512-SUMS.txt | grep -v mono | sha512sum -c -
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          T="$HOME/.local/share/godot/export_templates/4.7.2.stable"; mkdir -p "$T"
          unzip -q -j Godot_v4.7.2-stable_export_templates.tpz 'templates/*' -d "$T"
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Pipeline (no browser export, no Chrome)
        working-directory: "repo with space/gülün"
        run: |
          bash scripts/migration/build_phase1.sh --fresh --functional
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-packages
          path: |
            repo with space/gülün/builds/phase1/AbbeySlice-windows-x86_64.zip
            repo with space/gülün/builds/phase1/pipeline/*.txt
            repo with space/gülün/builds/phase1/checks/
